name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP tests + lint + contenido
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      # fetch-depth 0: el chequeo de frescura del lastmod compara el diff del
      # push contra la fecha `updated:` de cada articulo, y para eso necesita
      # historia, no un checkout superficial.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo, dom
          coverage: none
          tools: none

      - name: PHP syntax lint
        run: |
          set -e
          find core controllers models public bin tests themes content -name "*.php" -print0 \
            | xargs -0 -n1 -P4 php -l > /tmp/lint.log 2>&1 || (cat /tmp/lint.log && exit 1)
          grep -v "No syntax errors" /tmp/lint.log && exit 1 || true
          echo "Lint OK"

      - name: Run test suite
        run: php tests/run.php

      # Valida el contenido sin escribir el cache: front-matter bien formado,
      # slugs limpios, enums validos y toda referencia (categoria, autor,
      # producto, afiliado) apuntando a algo que existe. Si esto falla, el
      # sitio no levantaria en produccion.
      - name: Validar content/
        run: php bin/build-content.php --check

      # El <lastmod> del sitemap sale del campo `updated:` del front-matter. Si
      # se edita el cuerpo de un articulo y la fecha no se mueve, Google no se
      # entera del cambio, y una senal que miente en parte del sitio se
      # descarta para todo el sitio. Un commit reescribio 29 encabezados en 9
      # notas sin mover una sola fecha: esto lo hubiera atajado.
      - name: Frescura del lastmod
        if: github.event_name == 'push'
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          git fetch --depth=50 origin "${{ github.sha }}" 2>/dev/null || true
          php bin/check-updated.php "$BASE" "${{ github.sha }}"

  smoke:
    name: Smoke test de rutas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, fileinfo, dom
          coverage: none
          tools: none

      # Levanta el sitio de verdad y verifica que cada ruta publica responda lo
      # que tiene que responder. Un 500 por una vista rota no lo agarran ni el
      # lint ni los unit tests.
      - name: Levantar servidor y chequear rutas
        run: |
          DOMAIN=$(php -r 'echo (require "content/site.php")["domain"];')
          # bin/dev-server.php replica el rewrite de Apache. Sin el, PHP <= 8.3
          # devuelve 404 en /sitemap.xml y demas rutas con extension.
          DEV_SITE_DOMAIN=$DOMAIN php -S 127.0.0.1:8080 -t public bin/dev-server.php > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8080/healthz && break
            sleep 0.5
          done
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1")
            if [ "$code" != "$2" ]; then
              echo "  FAIL $1 -> $code (esperado $2)"; fail=1
            else
              echo "  ok   $1 -> $code"
            fi
          }
          check /                    200
          check /productos           200
          check /guias               200
          check /resenas             200
          check /comparativas        200
          check /noticias            200
          check "/buscar?q=seguridad" 200
          check /comparar            200
          check /sitemap.xml         200
          check /robots.txt          200
          check /feed.xml            200
          check /llms.txt            200
          check /llms-full.txt       200
          check /healthz             200
          check /no-existe           404
          check /admin               404
          # Cada articulo, producto, categoria y autor publicado debe renderizar.
          for url in $(php bin/list-urls.php); do check "$url" 200; done
          if [ "$fail" = "1" ]; then echo; echo "Hay rutas rotas."; cat /tmp/server.log; exit 1; fi

      # Auditoria de SEO, GEO y arquitectura sobre el HTML servido. Falla solo
      # ante errores (H1 duplicado, huerfana, sin canonical); las advertencias
      # quedan como informe para leer en el log.
      - name: Auditoria SEO / GEO / arquitectura
        run: php bin/audit.php

      - name: Log del servidor si algo fallo
        if: failure()
        run: cat /tmp/server.log
