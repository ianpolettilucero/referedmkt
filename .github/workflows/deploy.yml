name: Deploy

# Dispara el deploy en Hostinger, pero SOLO si el CI de main quedo verde.
#
# Por que no el webhook de GitHub directo a Hostinger: ese pega en cuanto hay
# push, sin mirar si los tests pasan ni si content/ compila. Un front-matter
# roto tiraria el sitio entero. Asi el deploy espera al CI.
#
# Soporta dos mecanismos; usa el que tengas configurado, en este orden:
#
#   A) SSH  (recomendado — el plan Business lo incluye)
#      hPanel -> Avanzado -> Acceso SSH: ahi estan host, puerto y usuario.
#      Generá el par de claves en tu maquina:
#          ssh-keygen -t ed25519 -f ~/.ssh/capacero_deploy -N ""
#      La PUBLICA (~/.ssh/capacero_deploy.pub) va en hPanel -> Acceso SSH ->
#      Claves SSH. La PRIVADA (~/.ssh/capacero_deploy, el archivo sin .pub)
#      va como secret SSH_KEY en GitHub.
#      Secrets: SSH_HOST, SSH_USER, SSH_KEY. Opcionales: SSH_PORT (default 22),
#      DEPLOY_PATH (si no, se prueban las rutas tipicas de Hostinger).
#
#   B) Webhook
#      Si en hPanel -> Avanzado -> GIT te aparece una URL de auto-deployment,
#      cargala como secret HOSTINGER_DEPLOY_WEBHOOK y listo.
#
# Sin ninguno de los dos el job no falla: avisa y termina.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:        # tambien se puede correr a mano desde la pestana Actions

jobs:
  deploy:
    name: Desplegar en Hostinger
    runs-on: ubuntu-latest
    # En workflow_dispatch no hay conclusion previa; en workflow_run exigimos exito.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # fetch-depth 2 para tener HEAD~1: el aviso a IndexNow necesita el diff
      # del ultimo commit para saber que URLs cambiaron. El deploy en si no usa
      # estos archivos (el servidor hace su propio git fetch), solo se leen.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Elegir mecanismo
        id: pick
        env:
          HOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_KEY" ]; then
            echo "mode=ssh" >> "$GITHUB_OUTPUT"
          elif [ -n "$HOOK" ]; then
            echo "mode=webhook" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::warning::No hay secrets de deploy cargados (SSH_HOST+SSH_KEY o HOSTINGER_DEPLOY_WEBHOOK). El deploy sigue siendo manual."
          fi

      # --- A) SSH -------------------------------------------------------------
      - name: Deploy por SSH
        if: steps.pick.outputs.mode == 'ssh'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DOMAIN: capacero.online
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Hostinger monta el sitio en ~/domains/<dominio>/public_html o en
          # ~/public_html segun como se creo. Probamos las dos si no nos dan ruta.
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" bash -s <<EOF
            set -e
            for d in "${DEPLOY_PATH:-}" "\$HOME/domains/$DOMAIN/public_html" "\$HOME/public_html"; do
              if [ -n "\$d" ] && [ -d "\$d/.git" ]; then TARGET="\$d"; break; fi
            done
            if [ -z "\${TARGET:-}" ]; then
              echo "No encontre un repo git en las rutas probadas." >&2
              exit 1
            fi
            echo "Desplegando en \$TARGET"
            cd "\$TARGET"
            git fetch origin main
            git reset --hard origin/main
            git rev-parse --short HEAD
          EOF
          rm -f ~/.ssh/id_deploy

      # --- B) Webhook ---------------------------------------------------------
      - name: Deploy por webhook
        if: steps.pick.outputs.mode == 'webhook'
        env:
          HOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        run: |
          # POST, no GET: el webhook de Hostinger espera el push event de
          # GitHub y responde 405 a cualquier otro metodo.
          code=$(curl -sS -X POST \
                      -H 'Content-Type: application/json' \
                      -d '{"ref":"refs/heads/main"}' \
                      -o /tmp/resp.txt -w '%{http_code}' \
                      --max-time 60 --retry 3 --retry-delay 5 "$HOOK")
          echo "HTTP $code"
          head -c 400 /tmp/resp.txt || true
          echo
          case "$code" in
            2*) echo "Deploy disparado." ;;
            *)  echo "::error::Hostinger respondio $code"; exit 1 ;;
          esac

      # --- Verificacion -------------------------------------------------------
      # Verificacion real: /healthz reporta el commit desplegado, asi que
      # comparamos contra el SHA que acaba de pasar el CI. Chequear solo que el
      # sitio responda 200 no probaria nada: ya respondia 200 antes del deploy.
      - name: Verificar que el commit correcto quedo en produccion
        if: steps.pick.outputs.mode != 'none'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          DOMAIN=$(grep -oP "(?<='domain' => ')[^']+" content/site.php | head -1)
          SHORT=$(echo "$EXPECTED_SHA" | cut -c1-8)
          echo "Dominio: $DOMAIN — esperando commit $SHORT"
          for i in $(seq 1 18); do
            sleep 10
            body=$(curl -sS --max-time 20 "https://$DOMAIN/healthz" || true)
            live=$(echo "$body" | grep -oP '(?<="commit":")[0-9a-f]+' || true)
            echo "  intento $i: commit=${live:-?} status=$(echo "$body" | grep -oP '(?<="status":")[a-z]+' || echo '?')"
            if [ "$live" = "$SHORT" ]; then
              case "$body" in
                *'"status":"ok"'*) echo "Deploy confirmado en $SHORT."; exit 0 ;;
              esac
              echo "::error::El commit llego pero el sitio reporta unhealthy: $body"
              exit 1
            fi
          done
          echo "::error::Produccion no llego al commit $SHORT despues de 3 minutos."
          echo "Ultimo /healthz: $body"
          exit 1

      # Aviso a los buscadores que hablan IndexNow (Bing, Yandex, Seznam,
      # Naver). Va DESPUES de confirmar el commit en produccion a proposito:
      # avisar de una URL que todavia no sirve el contenido nuevo es peor que
      # no avisar, porque el buscador la rastrea, no encuentra nada y no
      # vuelve enseguida.
      #
      # Google no entra aca: dio de baja el ping de sitemaps en junio de 2023 y
      # no tiene reemplazo abierto. Para Google la senal sigue siendo el
      # sitemap con su lastmod, que es justamente lo que verifica en CI
      # bin/check-updated.php.
      #
      # continue-on-error: el sitio ya esta publicado y andando. Que un aviso
      # opcional falle no puede pintar de rojo un deploy que salio bien.
      - name: Avisar a IndexNow
        if: steps.pick.outputs.mode != 'none'
        continue-on-error: true
        run: php bin/indexnow.php HEAD~1 HEAD
